name: Publish confirmed wallet artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-confirmed-wallet.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and unpack the GitHub Actions artifact archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/12672386962/zip" \
            --output artifact-archive.zip
          test -s artifact-archive.zip
          mkdir artifact-unpacked
          unzip -q artifact-archive.zip -d artifact-unpacked

          # GitHub Actions wraps uploaded artifacts in its own ZIP. Publish the
          # actual extension ZIP inside it, never the outer artifact container.
          mapfile -t extension_zips < <(find artifact-unpacked -type f -name 'veylora-chrome-extension-testnet.zip')
          if [ "${#extension_zips[@]}" -ne 1 ]; then
            echo "Expected exactly one extension ZIP inside the Actions artifact; found ${#extension_zips[@]}." >&2
            echo "Artifact contents:" >&2
            find artifact-unpacked -maxdepth 4 -type f -print >&2
            exit 1
          fi
          cp "${extension_zips[0]}" veylora-chrome-extension-testnet.zip
          test -s veylora-chrome-extension-testnet.zip
          unzip -tq veylora-chrome-extension-testnet.zip
          sha256sum veylora-chrome-extension-testnet.zip | tee wallet-zip.sha256

      - name: Publish permanent GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wallet-confirmed-2026-10-19
          name: Veylora Wallet — confirmed testnet build
          body: |
            Publishes the standalone wallet build validated by the successful UI regression, standalone build, and demo workflows as the confirmed Veylora testnet wallet build.

            The downloadable asset is the extension ZIP itself, not a ZIP containing another ZIP.

            Source workflow: https://github.com/Lordprolific/veylora-testnet-wallet/actions/runs/40370859367
            Source artifact ID: 12672386962
            Source build commit: 35c57e1664415b97cb6f91203c1613f77ed3e5bb

            This is an experimental Zcash testnet wallet. Do not use mainnet funds.
          files: |
            veylora-chrome-extension-testnet.zip
            wallet-zip.sha256
          fail_on_unmatched_files: true
          make_latest: true

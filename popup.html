<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#090a0c">
  <title>Veylora Wallet</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-width:320px;width:360px;background:#090a0c;color:#e8ebef;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{padding:18px}
    .brand{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.16em}
    .brand img{width:28px;height:28px;object-fit:contain}
    .panel{margin-top:24px;padding:20px;border:1px solid #282d35;border-radius:14px;background:linear-gradient(145deg,#111419,#0b0d11)}
    .eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#929ba8}
    h1{margin:10px 0 8px;font-size:23px;letter-spacing:-.04em;font-weight:600}
    p{margin:0;color:#a8b0bb;font-size:12px;line-height:1.65}
    button{width:100%;margin-top:20px;padding:12px 14px;border:1px solid #d5dbe3;border-radius:8px;background:#e8ebef;color:#090a0c;font-weight:650;font-size:12px;cursor:pointer}
    button:hover{background:#fff}
    .note{margin-top:13px;font-size:10px;color:#7f8996;line-height:1.55}
  </style>
</head>
<body>
  <header class="brand"><img src="./assets/veylora-mark.svg" alt=""><span>VEYLORA</span></header>
  <main class="panel">
    <div class="eyebrow">Zcash testnet wallet</div>
    <h1>Open your wallet</h1>
    <p>The wallet opens in its own tab so WebAssembly threading can initialize in the correct extension-page context.</p>
    <button id="expand-wallet" type="button">Open Veylora Wallet ↗</button>
    <p class="note">Testnet only. Never use real funds.</p>
  </main>
  <script type="module" src="./src/popup.ts"></script>
</body>
</html>

name: Standalone wallet build

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "dapp-provider.js"
      - "dapp-content.js"
      - "wallet.html"
      - "manifest.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/standalone-wallet-build.yml"
  push:
    branches: [feat/standalone-zcash-wallet, feat/market-dapp-provider]
    paths:
      - "src/**"
      - "public/**"
      - "wallet.html"
      - "manifest.json"
      - "background.js"
      - "dapp-provider.js"
      - "dapp-content.js"
      - "scripts/copy-extension-assets.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/standalone-wallet-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: veylora-extension-build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download previously verified pinned WebZjs build
        uses: actions/download-artifact@v4
        with:
          name: webzjs-wasm-packages-veylora-review-a50df944
          path: .engine/packages
          run-id: 39064868534
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Veylora dependencies
        run: npm install --no-audit --no-fund
      - name: Install locally built WebZjs packages
        run: |
          test -f .engine/packages/webzjs-wallet/webzjs_wallet.js
          test -f .engine/packages/webzjs-wallet/webzjs_wallet_bg.wasm
          test -f .engine/packages/webzjs-keys/webzjs_keys.js
          mkdir -p node_modules/@chainsafe
          cp -R .engine/packages/webzjs-wallet node_modules/@chainsafe/webzjs-wallet
          cp -R .engine/packages/webzjs-keys node_modules/@chainsafe/webzjs-keys
          cp .engine/packages/webzjs-wallet/LICENSE-APACHE .engine/packages/webzjs-wallet/LICENSE-MIT public/ 2>/dev/null || true
      - name: Type-check and build extension
        run: npm run build
      - name: Verify extension package files and network restriction
        run: |
          test -f dist/manifest.json
          test -f dist/background.js
          test -f dist/dapp-provider.js
          test -f dist/dapp-content.js
          test -f dist/wallet.html
          test -f dist/assets/veylora-mark.svg
          test -f dist/icons/icon16.png
          test -f dist/icons/icon48.png
          test -f dist/icons/icon128.png
          node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync("dist/manifest.json","utf8")); if(m.manifest_version!==3||!m.background?.service_worker) throw Error("Invalid MV3 package"); if(!m.host_permissions?.includes("https://zcash-testnet.chainsafe.dev/*")) throw Error("Testnet endpoint permission missing"); const js=fs.readdirSync("dist/assets").filter(x=>x.endsWith(".js")).map(x=>fs.readFileSync("dist/assets/"+x,"utf8")).join("\n"); if(js.includes("zcash-mainnet.chainsafe.dev")) throw Error("Mainnet endpoint found in testnet build"); console.log("MV3 package verified; testnet build only")'
      - name: Archive Chrome extension package
        run: |
          cd dist
          zip -r ../veylora-chrome-extension-testnet.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: veylora-chrome-extension-testnet
          path: veylora-chrome-extension-testnet.zip
          retention-days: 14

name: Standalone wallet build

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "wallet.html"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/standalone-wallet-build.yml"
  push:
    branches: [feat/standalone-zcash-wallet]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Verify extension package files
        run: |
          test -f dist/manifest.json
          test -f dist/background.js
          test -f dist/wallet.html

name: Demo build

on:
  push:
    paths:
      - "demo/**"
      - "manifest.json"
      - "popup.html"
      - "popup.js"
      - "popup.css"
      - "src/popup.ts"
      - "src/main.ts"
      - "package.json"
      - "public/**"
      - "docs/**"
      - "README.md"
      - "LICENSE-STATUS.md"
      - ".github/workflows/demo.yml"
  pull_request:
    paths:
      - "demo/**"
      - "manifest.json"
      - "popup.html"
      - "popup.js"
      - "popup.css"
      - "src/popup.ts"
      - "src/main.ts"
      - "package.json"
      - "public/**"
      - "docs/**"
      - "README.md"
      - "LICENSE-STATUS.md"
      - ".github/workflows/demo.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Run presentation tests
        run: npm test
      - name: Type-check and build
        run: npm run build

  extension-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate extension manifest
        run: node -e 'JSON.parse(require("fs").readFileSync("manifest.json", "utf8")); console.log("manifest.json is valid JSON")'
      - name: Check legacy popup JavaScript syntax
        run: node --check popup.js
      - name: Check actual wallet popup controls
        run: |
          node -e 'const fs=require("fs"); const html=fs.readFileSync("popup.html","utf8"); const js=fs.readFileSync("src/popup.ts","utf8"); if (!html.includes("id=\"app\"")) throw new Error("Popup app mount is missing"); if (!html.includes("id=\"expand-wallet\"") || !js.includes("#expand-wallet") || !js.includes("wallet.html")) throw new Error("Expand wallet control is not wired"); if (!html.includes("src/main.ts")) throw new Error("Wallet application entry is missing"); console.log("Wallet popup controls are wired")'

name: Veylora extension CI

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-testnet-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: Build Chrome extension
        run: npm run build
      - name: Upload installable extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: veylora-testnet-wallet-extension
          path: dist/
          if-no-files-found: error
          retention-days: 14

name: Standalone wallet build

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "wallet.html"
      - "popup.html"
      - "popup.js"
      - "popup.css"
      - ".github/workflows/demo.yml"
      - "manifest.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/standalone-wallet-build.yml"
  push:
    branches: [main, feat/standalone-zcash-wallet]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "wallet.html"
      - "popup.html"
      - "popup.js"
      - "popup.css"
      - ".github/workflows/demo.yml"
      - "manifest.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/standalone-wallet-build.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: veylora-extension-build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download previously verified pinned WebZjs build
        uses: actions/download-artifact@v4
        with:
          name: webzjs-wasm-packages-veylora-review-a50df944
          path: .engine/packages
          run-id: 39064868534
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Veylora dependencies
        run: npm install --no-audit --no-fund
      - name: Install locally built WebZjs packages
        run: |
          test -f .engine/packages/webzjs-wallet/webzjs_wallet.js
          test -f .engine/packages/webzjs-wallet/webzjs_wallet_bg.wasm
          test -f .engine/packages/webzjs-keys/webzjs_keys.js
          mkdir -p node_modules/@chainsafe
          cp -R .engine/packages/webzjs-wallet node_modules/@chainsafe/webzjs-wallet
          cp -R .engine/packages/webzjs-keys node_modules/@chainsafe/webzjs-keys
          cp .engine/packages/webzjs-wallet/LICENSE-APACHE .engine/packages/webzjs-wallet/LICENSE-MIT public/ 2>/dev/null || true
      - name: Type-check and build extension
        run: npm run build
      - name: Verify extension package files and network restriction
        run: |
          test -f dist/manifest.json
          test -f dist/background.js
          test -f dist/dapp-content.js
          test -f dist/dapp-provider.js
          test -f dist/wallet.html
          node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync("dist/manifest.json","utf8")); for (const p of (m.content_scripts||[]).flatMap(x=>x.js||[])) if (!fs.existsSync("dist/"+p)) throw Error("Manifest content script missing from package: "+p); for (const p of (m.web_accessible_resources||[]).flatMap(x=>x.resources||[])) if (!fs.existsSync("dist/"+p)) throw Error("Manifest web-accessible resource missing from package: "+p); console.log("All manifest-declared scripts/resources exist at extension root")'
          test -f dist/assets/veylora-mark.svg
          test -f dist/icons/icon16.png
          test -f dist/icons/icon48.png
          test -f dist/icons/icon128.png
          node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync("dist/manifest.json","utf8")); if(m.manifest_version!==3||!m.background?.service_worker) throw Error("Invalid MV3 package"); if(m.cross_origin_embedder_policy?.value!=="require-corp"||m.cross_origin_opener_policy?.value!=="same-origin") throw Error("Cross-origin isolation manifest policies missing"); if(!m.host_permissions?.includes("https://zcash-testnet.chainsafe.dev/*")) throw Error("Testnet endpoint permission missing"); const popup=fs.readFileSync("dist/popup.html","utf8"); if(!popup.includes("expand-wallet")||popup.includes("src/main.ts")) throw Error("Popup must launch, not initialize, the wallet app"); const js=fs.readdirSync("dist/assets").filter(x=>x.endsWith(".js")).map(x=>fs.readFileSync("dist/assets/"+x,"utf8")).join("\n"); if(js.includes("zcash-mainnet.chainsafe.dev")) throw Error("Mainnet endpoint found in testnet build"); console.log("MV3 package verified; isolation policies and testnet-only build confirmed")'
      - name: Archive Chrome extension package
        run: |
          cd dist
          zip -r ../veylora-chrome-extension-testnet.zip .
          cd ..
          sha256sum veylora-chrome-extension-testnet.zip > wallet-zip.sha256
      - name: Publish latest Chrome extension release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wallet-0.3.4-2026-10-27
          name: Veylora Wallet 0.3.4 — In-wallet approvals and recovery paste
          target_commitish: main
          body: |
            Veylora Wallet 0.3.4 testnet-only Chrome extension.

            - Toolbar popup opens the wallet in its own extension tab.
            - In-wallet approval UI for connection and sign-in signatures.
            - Recovery phrase paste fills consecutive fields or all 24 fields for a complete phrase.
            - Build verifies the manifest's COOP/COEP isolation policies and required dApp bridge resources.
            - Testnet only; experimental and unaudited.
            - Chrome real-browser wallet and Market integration checks are still required.
          files: |
            veylora-chrome-extension-testnet.zip
            wallet-zip.sha256
          make_latest: true
      - uses: actions/upload-artifact@v4
        with:
          name: veylora-chrome-extension-testnet
          path: veylora-chrome-extension-testnet.zip
          retention-days: 14

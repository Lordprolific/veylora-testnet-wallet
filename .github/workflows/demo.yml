name: Demo build

on:
  push:
    paths:
      - "demo/**"
      - ".github/workflows/demo.yml"
  pull_request:
    paths:
      - "demo/**"
      - ".github/workflows/demo.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Inspect dependency advisories
        run: |
          npm audit --json > audit-report.json || true
          node -e 'const a=JSON.parse(require("fs").readFileSync("audit-report.json","utf8")); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, vulnerabilities:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,url:x.url,range:x.range})}))},null,2))'
      - name: Run presentation tests
        run: npm test
      - name: Type-check and build
        run: npm run build

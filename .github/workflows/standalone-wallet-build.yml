name: Standalone wallet build

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "wallet.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/standalone-wallet-build.yml"
  push:
    branches: [feat/standalone-zcash-wallet]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify extension package files
        run: |
          test -f dist/manifest.json
          test -f dist/background.js
          test -f dist/wallet.html
          node -e "const m = require('./dist/manifest.json'); if (m.manifest_version !== 3) process.exit(1); if (!m.background?.service_worker) process.exit(1)"
